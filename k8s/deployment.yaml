apiVersion: apps/v1
kind: Deployment
metadata:
  name: empresa-backend
  namespace: empresa
  labels:
    app: empresa-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: empresa-backend
  template:
    metadata:
      labels:
        app: empresa-backend
    spec:
      containers:
        - name: empresa-backend
          image: registromiempresalaav31.azurecr.io/backendimage:v2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8085
              name: http
          env:
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: empresa-backend-secrets
                  key: DB_URL
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: empresa-backend-secrets
                  key: DB_USER
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: empresa-backend-secrets
                  key: DB_PASS
            - name: TENANT_ID
              valueFrom:
                secretKeyRef:
                  name: empresa-backend-secrets
                  key: TENANT_ID
            - name: CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: empresa-backend-secrets
                  key: CLIENT_ID
            - name: CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: empresa-backend-secrets
                  key: CLIENT_SECRET
            - name: MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE
              value: "health,metrics"
            - name: MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED
              value: "true"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: empresa-backend
  namespace: empresa
spec:
  type: LoadBalancer
  selector:
    app: empresa-backend
  ports:
    - name: http
      port: 80
      targetPort: 8085